name: ci
on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Unit, integration and smoke tests
        run: python -m pytest -q
      - name: Toolchain check
        run: metasense doctor
      - name: Sample analysis (expected exit 0)
        run: metasense analyze data/sample/paper_weak.txt
      - name: Packaging check (non-editable install reports the right version)
        run: python scripts/check_packaging.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t metasense:ci .
      - name: Tests inside the container
        run: docker run --rm --entrypoint python metasense:ci -m pytest -q
      - name: Sample analysis inside the container
        run: docker run --rm metasense:ci analyze /app/data/sample/paper_weak.txt
